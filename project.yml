name: Wnip
options:
  deploymentTarget:
    macOS: "15.0"
targets:
  Wnip:
    type: application
    platform: macOS
    sources:
      - path: Wnip
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: com.wnip.app
      INFOPLIST_KEY_LSUIElement: true
      GENERATE_INFOPLIST_FILE: YES
      SUPPORTED_PLATFORMS: macosx
      ENABLE_APP_INTENTS_METADATA_GENERATION: NO
      SWIFT_VERSION: "5.0"
  WnipTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WnipTests
    dependencies:
      - target: Wnip
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.wnip.tests
      GENERATE_INFOPLIST_FILE: YES
      SUPPORTED_PLATFORMS: macosx
      ENABLE_APP_INTENTS_METADATA_GENERATION: NO
      SWIFT_VERSION: "5.0"
